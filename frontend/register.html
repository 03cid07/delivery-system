<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messy Café - Create Account</title>
    <style>
        :root { --primary: #6c5ce7; --primary-hover: #5649c0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f1f2f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: var(--primary); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1.5px solid #eee; border-radius: 10px; box-sizing: border-box; outline: none; }
        input:focus, textarea:focus { border-color: var(--primary); }
        textarea { height: 80px; resize: none; font-family: inherit; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: var(--primary-hover); }
        .footer-links { margin-top: 20px; font-size: 14px; color: #636e72; }
        .footer-links a { color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="register-box">
    <h2 class="cafe-heading" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
    <img src="messy-logo.jpg" alt="Messy Cafe Logo" style="height: 1em; width: 1em; border-radius: 50%;">
    <span>Messy Café Login</span>
    </h2>
        <input type="text" id="regDisplayName" placeholder="Full Name (e.g., Juan Dela Cruz)">
        <input type="text" id="regUsername" placeholder="Username">
        <input type="password" id="regPassword" placeholder="Password">
        <input type="text" id="regPhone" placeholder="Phone Number">
        <textarea id="regAddress" placeholder="Delivery Address"></textarea>
        
        <button onclick="handleRegister()">Sign Up</button>
        
        <div class="footer-links">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>
    async function handleRegister() {
        const data = {
            username: document.getElementById('regUsername').value,
            password: document.getElementById('regPassword').value,
            display_name: document.getElementById('regDisplayName').value,
            address: document.getElementById('regAddress').value,
            phone_number: document.getElementById('regPhone').value,
            role: 'CUSTOMER' // Automatically set as customer
        };

        if (!data.username || !data.password || !data.display_name) {
            alert("Please fill in the required fields.");
            return;
        }

        try {
            const response = await fetch('http://localhost:8081/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert("Account created successfully! Please login.");
                window.location.href = 'login.html';
            } else {
                alert("Registration failed. Username might be taken.");
            }
        } catch (err) {
            alert("Error connecting to server.");
        }
    }
    </script>
</body>
</html>
